<!DOCTYPE html> <!-- Deklarasi tipe dokumen untuk standar HTML5 modern -->
<html> <!-- Tag pembuka utama untuk seluruh dokumen HTML -->
    <head> <!-- Bagian kepala: berisi informasi/metadata (tidak muncul langsung di halaman) -->
        <meta charset="UTF-8"> <!-- Mengatur pengodean karakter agar huruf & simbol tampil normal -->
        <title>Asia My Univ</title> <!-- Judul yang muncul di tab browser -->
    </head>
    <body bgcolor="#FFEFED"> <!-- Bagian badan: berisi semua konten visual (ditambah simbol # untuk warna hex) -->
        
        <!-- Tag h1: Heading tingkat 1 (Judul Utama) -->
        <h1>ASIA</h1> 

        <!-- Tag p: Paragraph (Digunakan untuk membungkus satu alinea/kelompok teks) -->
        <p>Halo wak! Terima kasih udah dateng.</p> 
        
        <p>
            Kali ini aku dengan seneng hati belajar HTML dari 0. 
            Ya seenggaknya kalo suatu saat harus jadi <strong>Agentic Software Developer</strong>, 
            nggak <em>malu-maluin</em> lah.
        </p>
        <!-- Note: <strong> membuat teks tebal & penting, <em> membuat teks miring (penekanan) -->

    </body> <!-- Tag penutup untuk elemen body -->
</html> <!-- Tag penutup utama dokumen HTML -->

<!-- by the way ini saya pakai komen untuk bahan saya belajar html pertama kali-->
